<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Wardrobe</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE8;--card:#FFFFFF;--ink:#1E1C1A;--on-ink:#FFFFFF;--mute:#68625B;--line:#E4DED4;--accent:#2E3A55;--on-accent:#FFFFFF;--stage:#ECE6DC;--soft:#F7F4EF;--good:#3F6B4A;--warn:#9A5B1E;--bad:#A3412D;--faint:#B7AE9F;--scrim:rgba(20,18,16,.38);--badge:rgba(255,255,255,.92);--pic:#F7F4EF;--stg:#ECE6DC;--hero:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171513;--card:#221F1C;--ink:#EEE9E1;--on-ink:#171513;--mute:#A39B90;--line:#34302B;--accent:#A9B8D9;--on-accent:#171513;--stage:#3A3631;--soft:#2D2A26;--good:#7FB08A;--warn:#D9A066;--bad:#E08A75;--faint:#6E675E;--scrim:rgba(0,0,0,.6);--badge:rgba(34,31,28,.92);--pic:#D3CCBF;--stg:#C9C1B3;--hero:#D3CCBF;color-scheme:dark}}
:root[data-theme=dark]{--bg:#171513;--card:#221F1C;--ink:#EEE9E1;--on-ink:#171513;--mute:#A39B90;--line:#34302B;--accent:#A9B8D9;--on-accent:#171513;--stage:#3A3631;--soft:#2D2A26;--good:#7FB08A;--warn:#D9A066;--bad:#E08A75;--faint:#6E675E;--scrim:rgba(0,0,0,.6);--badge:rgba(34,31,28,.92);--pic:#D3CCBF;--stg:#C9C1B3;--hero:#D3CCBF;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{display:flex;justify-content:center;accent-color:var(--accent);caret-color:var(--accent)}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
b,.kpi b,.stats3 b,.right,.bars{font-variant-numeric:tabular-nums}
.app{width:100%;max-width:460px;min-height:100vh;padding:14px 16px 100px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 12px}
h1{font-family:Fraunces,serif;font-weight:500;font-size:27px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:2px 0 0}
.add{flex:none;height:44px;padding:0 16px;border-radius:99px;border:0;background:var(--ink);color:var(--on-ink);font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.add svg{width:16px;height:16px}
.ghost{flex:none;height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;cursor:pointer}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px}
.kpi small{display:block;font-size:12px;color:var(--mute)}
.kpi b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:1px}

.bar{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip .ck{width:14px;height:14px;margin-left:5px;vertical-align:-2px}
.find{display:flex;gap:8px;margin:0 0 10px}
.find .search{flex:1;margin:0}
select.sort{flex:none;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;padding:0 12px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.it{background:var(--card);border:2px solid transparent;border-radius:14px;padding:6px;cursor:pointer;position:relative;text-align:left}
.it.on{border-color:var(--accent)}
.pic{width:100%;aspect-ratio:1;border-radius:10px;background:var(--pic);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img{max-width:88%;max-height:88%;object-fit:contain}
.pic.photo img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover}
.nm{font-size:12.5px;margin-top:5px;line-height:1.3;min-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.br{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagc{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;background:var(--badge);padding:2px 7px;border-radius:99px}
.none{width:40%;height:40%;color:var(--faint)}
.nopic{width:42%;height:42%;color:var(--faint)}
.nophoto{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:500;cursor:pointer}
.nophoto .nopic{width:64px;height:64px}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:36px 12px;grid-column:1/-1;line-height:1.5}

.stage{position:relative;width:100%;aspect-ratio:3/4.4;background:var(--stg);border-radius:20px;overflow:hidden}
.layer{position:absolute;left:50%;transform:translateX(-50%);transition:all .3s ease;pointer-events:none}
.layer img{height:100%;width:auto;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.13))}
.stand .L-jacket{top:3%;height:40%;z-index:4}
.stand .L-top{top:6%;height:40%;z-index:2}
.stand:not(.nojacket) .L-top img{clip-path:inset(38% 22% 0 22%)}
.stand .L-bottom{top:36%;height:53%;z-index:1}
.stand.tuck .L-bottom{z-index:3}
.stand .L-shoes{top:86%;height:11%;z-index:5}
.stand .L-acc{bottom:4%;left:auto;right:4%;transform:none;height:16%;z-index:6}
.flat .layer{transform:none}
.flat .L-jacket{top:3%;left:3%;height:34%;z-index:2}
.flat .L-top{top:20%;left:45%;height:31%;z-index:3}
.flat.nojacket .L-top{top:4%;left:18%;height:38%}
.flat .L-bottom{top:42%;left:8%;height:53%;z-index:1}
.flat .L-shoes{top:78%;left:52%;height:12%;z-index:4}
.flat .L-acc{top:56%;left:62%;height:16%;z-index:5}
.layer.photo img{border-radius:10px;filter:none;width:100%;object-fit:cover}

.tools{display:flex;gap:8px;margin-top:10px}
.tool{flex:1;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;cursor:pointer}
.tool.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tool:disabled{opacity:.4;cursor:default}
.seg{flex:1.6;display:flex;border:1px solid var(--line);border-radius:99px;background:var(--card);padding:3px;gap:2px}
.seg button{flex:1;border:0;border-radius:99px;background:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}

.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.look,.row,.day,.wcard,.tmini{font:inherit;color:inherit;text-align:left;border:0;width:100%;display:block}
.look{background:var(--card);border-radius:18px;padding:6px;cursor:pointer}
.look .stage{border-radius:14px}
.look .ln{font-size:13px;font-weight:500;margin:6px 4px 0}
.look .lm{font-size:12px;color:var(--mute);margin:1px 4px 4px}

.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer}
.row .pic{width:62px;height:62px;flex:none}
.row b{font-weight:500;font-size:14px;display:block}
.row small{color:var(--mute);font-size:12.5px;display:block;margin-top:1px}
.row .right{margin-left:auto;text-align:right;flex:none;font-size:13px;font-weight:600}
.sect{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px;display:flex;justify-content:space-between}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:15px;font-weight:600}
.cal-head button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--mute);text-align:center;padding:2px 0}
.day{aspect-ratio:.72;background:var(--card);border-radius:10px;padding:3px;cursor:pointer;position:relative;border:1.5px solid transparent;display:flex;flex-direction:column;overflow:hidden}
.day.out{opacity:.4}
.day.today{border-color:var(--ink)}
.day .dn{font-size:12px;font-weight:600;line-height:1.2}
.day .mini{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.day .mini .stage{height:100%;width:auto;background:none;border-radius:0}
.day .mini .layer img{filter:none}
.wd{position:absolute;bottom:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--good);border:1.5px solid var(--good)}
.day.planned:not(.worn) .wd,.wd.plan{background:var(--card);border-color:var(--mute)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mute);margin:10px 2px 4px}
.legend span{display:flex;align-items:center;gap:6px}.legend .wd{position:static}

.wish{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wcard{background:var(--card);border-radius:16px;padding:8px;cursor:pointer;position:relative}
.wcard .wn{font-size:13px;font-weight:500;margin:6px 2px 0;line-height:1.3}
.wcard .wp{font-size:12.5px;color:var(--mute);margin:2px 2px;display:flex;justify-content:space-between;gap:6px}
.prio{position:absolute;top:14px;left:14px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ink);color:var(--on-ink)}
.prio.nice{background:var(--card);color:var(--ink);border:1px solid var(--line)}

.bars .b{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.bars .b span:first-child{width:84px;color:var(--mute)}
.bars .track{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);border-radius:99px}
.bars .b span:last-child{width:76px;text-align:right;font-weight:500}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:13px;font-weight:600;margin:0 0 6px}

/* today: the morning front door on the Closet tab */
.tday{background:var(--card);border-radius:18px;padding:12px;margin:0 0 14px}
.today-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 10px}
.today-h h2{font-family:Fraunces,serif;font-weight:500;font-size:19px;margin:0}
.today-h small{font-size:12.5px;color:var(--mute)}
.today-main{display:flex;gap:12px;align-items:center}
.today-main .stage{width:96px;flex:none;border-radius:12px}
.today-main.worn .stage{width:64px}
.today-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.today-txt small{font-size:12.5px;color:var(--mute)}
.today-txt b{font-size:15px;font-weight:600;line-height:1.3}
.today-txt .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.today-hint{font-size:13px;color:var(--mute);margin:0 2px 8px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.tmini{flex:none;width:92px;background:var(--soft);border-radius:14px;padding:4px;cursor:pointer;scroll-snap-align:start}
.tmini .stage{border-radius:10px}
.tmini span{display:block;font-size:12px;line-height:1.3;margin:5px 3px 2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.6em}
.strip-lbl{font-size:12.5px;color:var(--mute);margin:12px 2px 8px}

.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:460px;width:100%;display:flex;justify-content:space-around;padding:4px 0 6px}
.nav button{background:none;border:0;font-size:12px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:62px;min-height:52px}
.nav button.on{color:var(--ink);font-weight:600}
.nav svg{width:22px;height:22px}
.view{display:none}.view.on{display:block}
body.building .nav{display:none}

/* builder: picture and pieces fit one screen, save sits under the thumb */
#v-builder{padding-bottom:84px}
#v-builder .stage{width:auto;height:clamp(220px,40vh,420px);margin:0 auto}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.rail::-webkit-scrollbar{display:none}
.rail .it{flex:none;width:96px}
.rail .empty{padding:16px 4px;text-align:left}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
body.building .savebar{display:flex}
.savebar div{width:100%;max-width:428px;display:flex;gap:8px}
.savebar .btn{margin:0}

.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{position:relative;background:var(--bg);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet:focus{outline:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--faint);margin:0 auto 12px}
.close{position:absolute;top:6px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.close::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.close svg{position:relative;width:16px;height:16px}
.sheet h2{font-family:Fraunces,serif;font-weight:500;font-size:21px;margin:0 40px 2px 0;line-height:1.2}
.sheet .meta{font-size:12.5px;color:var(--mute);margin-bottom:12px}
.hero{background:var(--hero);border-radius:16px;height:210px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero img{max-height:190px;max-width:90%}
.hero.photo img{max-height:100%;max-width:100%;width:100%;height:100%;object-fit:cover}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stats3 div{background:var(--card);border-radius:12px;padding:9px 10px}
.stats3 small{display:block;font-size:12px;color:var(--mute)}
.stats3 b{font-size:16px;font-weight:600}
.facts{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:13px;margin-top:10px}
.facts td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.facts tr:first-child td{border-top:0}
.facts td:first-child{color:var(--mute);width:40%}
.facts a{color:var(--accent)}
.lbl{font-size:12px;font-weight:600;margin:14px 0 6px}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;font-size:14px;font-weight:500;min-height:46px;padding:12px;border-radius:12px;border:0;background:var(--ink);color:var(--on-ink);cursor:pointer;display:block}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.btns.apart{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
details.more{margin:4px 0 10px}
details.more summary{font-size:13.5px;font-weight:500;color:var(--accent);cursor:pointer;padding:10px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}details.more[open] summary::before{content:"− "}
.form .f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.form label{font-size:12px;font-weight:600}
.form input,.form select,.form textarea{width:100%;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.form textarea{min-height:70px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{font-size:12.5px;color:var(--bad);min-height:1em}
.photo-in{display:flex;flex-direction:row!important;gap:12px;align-items:center}
.photo-in .pic{width:84px;height:84px;flex:none}
.photo-in label.up{font-size:13px;font-weight:500;color:var(--accent);cursor:pointer;text-decoration:underline}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--on-ink);padding:6px 6px 6px 16px;min-height:44px;border-radius:22px;font-size:13.5px;opacity:0;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:60;max-width:calc(100vw - 32px);width:max-content;display:flex;align-items:center;gap:6px;line-height:1.4}
.toast:not(.undo){padding-right:16px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.on.undo{pointer-events:auto}
.toast button{display:none;border:0;background:none;color:var(--on-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 10px;cursor:pointer}
.toast.undo button{display:block}
body.building .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
.note{font-size:12.5px;color:var(--mute);line-height:1.45;margin:8px 2px}
.search{position:relative;margin:0 0 10px}
.search input{width:100%;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 40px 0 38px;font-size:14px}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--mute)}
.search button{position:absolute;right:2px;top:2px;width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;display:none;align-items:center;justify-content:center}
.search button svg{position:static;width:16px;height:16px;color:var(--ink)}
.search.has button{display:flex}
.stats3 em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:1px}
.banner{display:none;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:8px 8px 8px 12px;margin:0 0 12px;font-size:13px;cursor:pointer}
.banner.on{display:flex}
.banner b{font-weight:600}.banner span{flex:1}
.banner button{flex:none;border:0;border-radius:99px;background:var(--on-accent);color:var(--accent);font-size:13px;font-weight:600;min-height:40px;padding:0 14px;cursor:pointer}
.banner.install{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.banner.install button{background:var(--ink);color:var(--on-ink)}
.banner.install button.x{background:none;color:var(--mute);width:40px;padding:0;display:flex;align-items:center;justify-content:center}
.banner .x svg{width:16px;height:16px}
.gear{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.gear svg{width:18px;height:18px}
.dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);display:none}
.dot.on{display:block}
.nav button{position:relative}.nav .dot{top:4px;right:16px;border-color:var(--card)}
.welcome{text-align:center;padding:10px 4px 6px}
.welcome img{width:84px;height:84px;border-radius:22px}
.welcome h2{margin:14px 0 6px!important}
.welcome p{font-size:14px;color:var(--mute);line-height:1.5;margin:0 0 16px}
.welcome ul{text-align:left;font-size:14px;line-height:1.5;margin:0 0 16px;padding:12px 14px 12px 32px;background:var(--card);border-radius:14px}
.steps{text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-top:12px}
.mrow{display:grid;grid-template-columns:1fr 92px 44px;gap:6px;margin-bottom:6px}
.mrow button{border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mrow button svg{width:16px;height:16px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 0;align-self:flex-start}
.ver{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:11px 12px;font-size:13.5px}
.ver small{color:var(--mute);display:block;font-size:12.5px}
.changes{background:var(--card);border-radius:12px;padding:4px 12px;font-size:13px}
.changes div{padding:8px 0;border-top:1px solid var(--line)}.changes div:first-child{border-top:0}
.changes small{color:var(--mute);display:block}
.facts a,.facts td{overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

 <section class="view on" id="v-closet">
  <div class="banner" id="updBanner" data-act="settings"><span><b>Update available.</b> <span id="updText"></span></span><button data-act="doUpdate">Update</button></div>
  <div class="banner install" id="instBanner"><span>Install Wardrobe on your home screen</span><button data-act="install">Install</button><button class="x" data-act="hideInstall" aria-label="Hide this"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="top"><div><h1>Closet</h1><p class="sub" id="closetSub"></p></div>
   <div style="display:flex;gap:8px"><button class="gear" data-act="settings" aria-label="Settings and updates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.5-1c-1.6.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-.9-1.6.8-3.3 2.4-2.4 1 .6 2.3.1 2.5-1.1z"/><circle cx="12" cy="12" r="3"/></svg><span class="dot" id="gearDot"></span></button>
   <button class="add" data-act="addItem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add</button></div></div>
  <section class="tday" id="today" aria-labelledby="todayH" hidden></section>
  <div class="find"><div class="search" id="searchBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
   <input id="q" type="search" placeholder="Search" aria-label="Search your closet" autocomplete="off"><button id="qClear" aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <select class="sort" id="sort" aria-label="Sort">
    <option value="recent">Newest</option><option value="worn">Most worn</option><option value="least">Least worn</option>
    <option value="cpw">Cost per wear</option><option value="price">Price</option></select></div>
  <div class="bar"><div class="chips" id="catChips"></div></div>
  <div class="grid" id="closetGrid"></div>
 </section>

 <section class="view" id="v-outfits">
  <div class="top"><div><h1>Outfits</h1><p class="sub" id="outfitSub"></p></div>
   <button class="add" data-act="newOutfit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New</button></div>
  <div class="bar"><div class="chips" id="tagChips"></div></div>
  <div class="looks" id="looks"></div>
 </section>

 <section class="view" id="v-builder">
  <div class="top"><div><h1 id="bTitle">New outfit</h1><p class="sub">Tap pieces to put them on.</p></div></div>
  <div class="stage stand" id="bStage"></div>
  <div class="tools">
   <div class="seg" role="group" aria-label="Picture style"><button id="bStand" aria-pressed="true">Stacked</button><button id="bFlat" aria-pressed="false">Flat lay</button></div>
   <button class="tool" id="bTuck" aria-pressed="false">Tuck in</button>
   <button class="tool" id="bRnd">Random</button>
  </div>
  <div class="bar" style="margin-top:12px"><div class="chips" id="bCats"></div></div>
  <div class="rail" id="bGrid"></div>
  <div class="form" style="margin-top:14px">
   <div class="f"><label for="bName">Name <span style="font-weight:400;color:var(--mute)">(optional)</span></label><input id="bName"></div>
   <div class="f"><label for="bTags">Occasion or tags</label><input id="bTags" placeholder="work, weekend, date"></div>
   <div class="err" id="bErr" role="alert"></div>
  </div>
 </section>

 <section class="view" id="v-plan">
  <div class="top"><div><h1>Plan</h1><p class="sub">Plan outfits and log what you wore.</p></div>
   <button class="ghost" data-act="today">Today</button></div>
  <div class="cal-head"><button id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><b id="calTitle" aria-live="polite"></b><button id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div class="cal" id="cal"></div>
  <div class="legend" aria-hidden="true"><span><i class="wd"></i>Worn</span><span><i class="wd plan"></i>Planned</span></div>
  <p class="note">Logging an outfit as worn adds a wear to every piece in it.</p>
  <div id="upcoming"></div>
 </section>

 <section class="view" id="v-wish">
  <div class="top"><div><h1>Wishlist</h1><p class="sub" id="wishSub"></p></div>
   <button class="add" data-act="addWish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add</button></div>
  <div class="bar"><div class="chips" id="wishChips"></div></div>
  <div class="wish" id="wishGrid"></div>
 </section>

 <section class="view" id="v-stats">
  <div class="top"><div><h1>Insights</h1><p class="sub">Where your money goes and what you wear.</p></div></div>
  <div id="stats"></div>
 </section>
</div>

<nav class="nav" aria-label="Main"><div>
 <button data-v="closet" class="on" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 6a2 2 0 1 1 2-2M12 6v2L3 15h18l-9-7"/></svg>Closet<span class="dot" id="navDot"></span></button>
 <button data-v="outfits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L4 6.5l1.6 4L8 9.6V20h8V9.6l2.4.9 1.6-4L15 4c-.4 1.3-1.6 2.1-3 2.1S9.4 5.3 9 4z"/></svg>Outfits</button>
 <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
 <button data-v="wish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Wishlist</button>
 <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Insights</button>
</div></nav>
<div class="savebar" id="saveBar"><div><button class="btn sec" data-act="cancelBuilder">Cancel</button><button class="btn" id="bSave" style="flex:2">Save outfit</button></div></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
const APP_VERSION='1.0.6';
/* ===== storage ===== */
const KEY='wardrobe-db-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let db={items:[],outfits:[],plan:{},wishlist:[],settings:{currency:'zł'},seen:[]};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.items))db={...db,...v}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Phone storage is full. Export a backup in Insights, Settings.');return false}}

/* ===== photo storage =====
   Your own photos live in IndexedDB (far more room than the closet data store); the item keeps
   only 'idb:<key>'. If IndexedDB isn't available the photo stays inline as before. */
const PH={};let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('wardrobe-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function idbReq(mode,fn){return new Promise((res,rej)=>{const tx=idb.transaction('p',mode),q=fn(tx.objectStore('p'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=tx.onabort=()=>rej(tx.error)})}
async function idbAll(){const out={};await new Promise(res=>{const tx=idb.transaction('p','readonly');const c=tx.objectStore('p').openCursor();
  c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}};tx.oncomplete=res;tx.onerror=res});return out}
async function storePhoto(blob){if(!idb)return await blobToData(blob);const key='ph-'+uid();await idbReq('readwrite',st=>st.put(blob,key));PH[key]=URL.createObjectURL(blob);return 'idb:'+key}
async function dropPhoto(src){if(idb&&src&&src.startsWith('idb:')){const k=src.slice(4);try{await idbReq('readwrite',st=>st.delete(k))}catch(e){}if(PH[k])URL.revokeObjectURL(PH[k]);delete PH[k]}}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const srcOf=src=>src&&src.startsWith('idb:')?(PH[src.slice(4)]||''):src;

/* ===== helpers ===== */
const SLOTS=['top','jacket','bottom','shoes','acc'];
const CATS={top:'Tops',bottom:'Bottoms',jacket:'Outerwear',shoes:'Shoes',acc:'Accessories'};
const CAT1={top:'Top',bottom:'Bottom',jacket:'Outerwear',shoes:'Shoes',acc:'Accessory'};
function money(n){if(n==null||n===''||isNaN(n))return '–';const c=db.settings.currency||'zł',v=Math.round(+n*100)/100;
  const s=v.toLocaleString('pl-PL',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});return c==='zł'||c==='kr'||c==='CHF'?s+' '+c:c+s}
function fmtDate(iso){if(!iso)return '–';const d=new Date((iso.length===7?iso+'-01':iso)+'T12:00');if(isNaN(d))return iso;
  return d.toLocaleDateString('en-GB',iso.length===7?{month:'short',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'})}
const isPhoto=src=>/^(data:|idb:|blob:)/.test(src||'');
const itemById=id=>db.items.find(i=>i.id===id);
function wearsOf(id){let n=0,last=null;
  for(const [d,e] of Object.entries(db.plan))if(e.worn&&(e.items||[]).includes(id)){n++;if(!last||d>last)last=d}
  const it=itemById(id);if(it){n+=it.extraWears||0;if(it.extraLast&&(!last||it.extraLast>last))last=it.extraLast}
  return {n,last}}
function cpw(it){if(it.price==null||it.price==='')return null;return +it.price/Math.max(1,wearsOf(it.id).n)}
const outfitItems=o=>SLOTS.map(k=>o.items[k]).filter(Boolean).map(itemById).filter(Boolean);
const outfitWears=o=>Object.values(db.plan).filter(e=>e.worn&&e.outfit===o.id).length;
let undoFn=null;
function toast(m,undo){const t=$('toast');$('toastMsg').textContent=m;undoFn=undo||null;t.classList.toggle('undo',!!undo);t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>{t.classList.remove('on');undoFn=null},undo?5500:1900)}
$('toastUndo').onclick=()=>{const f=undoFn;undoFn=null;$('toast').classList.remove('on');if(f)f()};
// snapshot of the closet before a change; calling the result puts it back (then reopens what was on screen)
function snapshot(reopen){const s=JSON.stringify(db);return ()=>{db=JSON.parse(s);save();renderAll();if(reopen)reopen();else closeSheet();toast('Undone')}}
const XICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const NOPIC='<svg class="nopic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 7a2 2 0 1 1 2-2M12 7v1.5L3 16h18l-9-7.5"/></svg>';
function picHTML(src){const u=srcOf(src);return u?`<div class="pic ${isPhoto(src)?'photo':''}"><img src="${esc(u)}" alt="" loading="lazy"></div>`:`<div class="pic">${NOPIC}</div>`}

/* ===== outfit picture: product photos stacked, no figure ===== */
function stageHTML(items,o={}){
  const g=k=>items[k]&&itemById(items[k]);let h='';
  for(const k of ['bottom','top','jacket','shoes','acc']){const it=g(k);if(!it)continue;
    const u=srcOf(it.img);if(!u)continue;h+=`<div class="layer L-${k} ${isPhoto(it.img)?'photo':''}" ${isPhoto(it.img)?'style="aspect-ratio:1"':''}><img src="${esc(u)}" alt="${esc(it.name)}"></div>`}
  return `<div class="stage ${o.flat?'flat':'stand'} ${o.tuck?'tuck':''} ${g('jacket')?'':'nojacket'}" ${o.id?`id="${o.id}"`:''}>${h}</div>`;
}

/* ===== closet ===== */
let cCat='all',cSort='recent';
let query='';
function renderCloset(){
  const items=db.items,W=i=>wearsOf(i.id).n;
  if(cCat!=='all'&&!items.some(i=>i.cat===cCat))cCat='all';
  $('closetSub').textContent=`${items.length} piece${items.length===1?'':'s'}`;
  $('catChips').innerHTML=['all',...Object.keys(CATS)].map(k=>{const n=k==='all'?items.length:items.filter(i=>i.cat===k).length;
    return (k==='all'||n)?`<button class="chip ${k===cCat?'on':''}" data-cat="${k}">${k==='all'?'All':CATS[k]} · ${n}</button>`:''}).join('');
  const S={recent:(a,b)=>(b.added||'').localeCompare(a.added||''),worn:(a,b)=>W(b)-W(a),least:(a,b)=>W(a)-W(b),
    cpw:(a,b)=>(cpw(b)??-1)-(cpw(a)??-1),price:(a,b)=>(+b.price||0)-(+a.price||0)};
  const q=query.trim().toLowerCase();
  const list=items.filter(i=>(cCat==='all'||i.cat===cCat)&&(!q||[i.name,i.brand,i.color,i.notes,i.store,i.size].join(' ').toLowerCase().includes(q))).sort(S[cSort]);
  $('searchBox').style.display=items.length>5?'':'none';$('searchBox').classList.toggle('has',!!q);$('sort').style.marginLeft=items.length>5?'':'auto';
  $('closetGrid').innerHTML=list.length?list.map(i=>{const c=cpw(i),w=W(i);
    const tag=cSort==='cpw'?(c!=null?money(c)+'/wear':''):cSort==='price'?(i.price!=null?money(i.price):''):(cSort==='worn'||cSort==='least')?w+'×':'';
    return `<button class="it" data-item="${i.id}">${tag?`<span class="tagc">${tag}</span>`:''}${picHTML(i.img)}<div class="nm">${esc(i.name)}</div><div class="br">${esc(i.brand||CAT1[i.cat])}${i.size?' · '+esc(i.size):''}</div></button>`}).join('')
    :`<div class="empty">${q?'Nothing matches “'+esc(query.trim())+'”.':cCat==='all'?'Your closet is empty. Tap Add to put in your first piece.':'No '+CATS[cCat].toLowerCase()+' yet.'}</div>`;
}
$('q').oninput=e=>{query=e.target.value;renderCloset()};
$('qClear').onclick=()=>{query='';$('q').value='';renderCloset();$('q').focus()};
$('catChips').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){cCat=b.dataset.cat;renderCloset()}};
$('sort').onchange=e=>{cSort=e.target.value;renderCloset()};
$('closetGrid').onclick=e=>{const b=e.target.closest('[data-item]');if(b)itemSheet(b.dataset.item)};

/* ===== today: one tap to log what you're wearing ===== */
let todayPick=false;
function lastWornOf(oid){let l='';for(const [d,e] of Object.entries(db.plan))if(e.worn&&e.outfit===oid&&d>l)l=d;return l}
const piecesOf=e=>Object.fromEntries((e.items||[]).map(itemById).filter(Boolean).map(i=>[i.cat,i.id]));
function renderToday(){
  const el=$('today'),t=todayISO(),e=db.plan[t],o=e&&db.outfits.find(x=>x.id===e.outfit);
  if(db.items.length<2){el.hidden=true;return}
  el.hidden=false;
  const head=`<div class="today-h"><h2 id="todayH">Today</h2><small>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</small></div>`;
  if(!db.outfits.length){el.innerHTML=head+`<p class="today-hint">Put an outfit together once, then log what you wear here in one tap.</p><button class="add" data-act="newOutfit">Make an outfit</button>`;return}
  const name=esc(o?o.name:'Outfit'),pic=e?stageHTML(piecesOf(e),{tuck:o&&o.tuck,flat:o&&o.flat}):'';
  const others=db.outfits.filter(x=>!e||x.id!==e.outfit).sort((a,b)=>lastWornOf(b.id).localeCompare(lastWornOf(a.id))||(b.created||'').localeCompare(a.created||''));
  const strip=others.length?`<div class="strip">${others.map(x=>`<button class="tmini" data-act="wearToday" data-id="${x.id}" aria-label="Wearing ${esc(x.name)} today">${stageHTML(x.items,{tuck:x.tuck,flat:x.flat})}<span>${esc(x.name)}</span></button>`).join('')}</div>`:'';
  if(e&&e.worn&&!todayPick){el.innerHTML=head+`<div class="today-main worn">${pic}<div class="today-txt"><small>Logged as worn</small><b>${name}</b><div class="acts"><button class="ghost" data-act="todayChange">Change</button></div></div></div>`;return}
  if(e&&!e.worn){el.innerHTML=head+`<div class="today-main">${pic}<div class="today-txt"><small>Planned for today</small><b>${name}</b><div class="acts"><button class="add" data-act="wearPlanned">Wearing this</button></div></div></div>`+(strip&&`<div class="strip-lbl">Wearing something else? Tap it.</div>`+strip);return}
  el.innerHTML=head+`<p class="today-hint">${e?'Tap what you\'re wearing instead.':'What are you wearing? Tap it to log it.'}</p>`+strip+(e?`<button class="linkbtn" data-act="todayKeep">Keep ${name}</button>`:'');
}

/* ===== sheets ===== */
let sheetOpen=false,curView='closet',ignorePop=0,pendingPush=[],lastFocus=null;
function push(state){if(ignorePop)pendingPush.push(state);else history.pushState(state,'')}
function openSheet(html){const s=$('sheet');s.innerHTML='<div class="grab"></div><button class="close" aria-label="Close" data-act="close">'+XICON+'</button>'+html;
  const h=s.querySelector('h2');if(h){h.id='sheetTitle';s.setAttribute('aria-labelledby','sheetTitle')}else s.removeAttribute('aria-labelledby');
  $('sheetBg').classList.add('on');s.scrollTop=0;
  if(!sheetOpen){sheetOpen=true;lastFocus=document.activeElement;push({v:curView,s:1})}
  s.focus({preventScroll:true})}
function closeSheet(fromPop){$('sheetBg').classList.remove('on');if(sheetOpen){sheetOpen=false;if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});lastFocus=null;if(fromPop!==true){ignorePop++;history.back()}}}
window.addEventListener('popstate',e=>{
  if(ignorePop){ignorePop--;if(!ignorePop){const q=pendingPush;pendingPush=[];q.forEach(st=>history.pushState(st,''))}return}
  if(sheetOpen){closeSheet(true);return}
  if(curView==='builder'&&B&&B.dirty&&!confirm('Discard this outfit?')){history.pushState({v:'builder'},'');return}
  show((e.state&&e.state.v)||'closet',true)});
$('sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('sheet').addEventListener('click',e=>{const r=e.target.closest('.row[data-item]');if(r)itemSheet(r.dataset.item)});

function itemSheet(id){
  const it=itemById(id);if(!it)return;
  const w=wearsOf(id),c=cpw(it);
  const inO=db.outfits.filter(o=>Object.values(o.items).includes(id));
  const ms=it.sizes&&it.size&&it.sizes[it.size],t=todayISO();
  const wornToday=it.extraLast===t||!!(db.plan[t]&&db.plan[t].worn&&(db.plan[t].items||[]).includes(id));
  openSheet(`<h2>${esc(it.name)}</h2><div class="meta">${esc([it.brand,CAT1[it.cat],it.color].filter(Boolean).join(' · '))}</div>

function readPhoto(file,max=900){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('photo')),'image/jpeg',.84)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('photo'))};im.src=u})}
let formPhoto='',newPhoto=null,photoJob=null; // newPhoto: a Blob picked in the open form, saved only when the form is saved

  photoJob=readPhoto(f).then(b=>{newPhoto=b;const u=URL.createObjectURL(b);document.querySelector('.photo-in .pic').outerHTML=`<div class="pic photo"><img src="${u}" alt=""></div>`;
    document.querySelector('.photo-in .note')?.replaceChildren('Photo ready')})
    .catch(()=>{$(errId).textContent="That photo couldn't be read. Try another.";document.querySelector('.photo-in .note')?.replaceChildren('')})}}
async function commitPhoto(prevSrc){ // returns the src to store for the form being saved
  if(photoJob)await photoJob.catch(()=>{}); // Save tapped while the photo was still being prepared
  if(!newPhoto)return formPhoto;const src=await storePhoto(newPhoto);newPhoto=null;
  if(prevSrc&&prevSrc!==src&&!db.items.some(i=>i.img===prevSrc)&&!db.wishlist.some(w=>w.img===prevSrc))await dropPhoto(prevSrc);return src}

function readMeasures(){const out={};for(const r of document.querySelectorAll('#mList .mrow')){const [k,v]=r.querySelectorAll('input');

async function saveItem(id){

/* ===== insights ===== */
function renderStats(){
  const it=db.items;
  if(!it.length){$('stats').innerHTML='<div class="empty">Add pieces to your closet to see insights.</div>';return}
  const W=i=>wearsOf(i.id).n;
  const spent=it.reduce((s,i)=>s+(+i.price||0),0),wears=it.reduce((s,i)=>s+W(i),0);
  const priced=it.filter(i=>i.price!=null&&i.price!=='');
  const byCat=Object.keys(CATS).map(k=>{const l=it.filter(i=>i.cat===k);return [k,l.reduce((s,i)=>s+(+i.price||0),0),l.length,priced.filter(i=>i.cat===k).length]}).filter(x=>x[2]);
  const maxCat=Math.max(1,...byCat.map(x=>x[1]));
  const most=[...it].filter(i=>W(i)>0).sort((a,b)=>W(b)-W(a)).slice(0,5);
  const best=priced.filter(i=>W(i)>0).sort((a,b)=>cpw(a)-cpw(b)).slice(0,5);
  const worst=priced.filter(i=>W(i)>0).sort((a,b)=>cpw(b)-cpw(a)).slice(0,5);
  const never=it.filter(i=>W(i)===0);
  const row=(i,r)=>`<button class="row" data-item="${i.id}">${picHTML(i.img)}<div><b>${esc(i.name)}</b><small>${CAT1[i.cat]} · worn ${W(i)}×</small></div><div class="right">${r}</div></button>`;
  const wishTotal=db.wishlist.reduce((s,w)=>s+(+w.price||0),0);
  $('stats').innerHTML=`<div class="kpis"><div class="kpi"><small>Pieces</small><b>${it.length}</b></div><div class="kpi"><small>Spent</small><b>${priced.length?money(spent):'–'}</b>${priced.length<it.length?`<em>${priced.length} of ${it.length} priced</em>`:''}</div><div class="kpi"><small>Wears</small><b>${wears}</b></div></div>
   <div class="card"><h2>Spending by category</h2><div class="bars">${byCat.map(([k,s,n,np])=>`<div class="b"><span>${CATS[k]}</span><div class="track"><div class="fill" style="width:${s/maxCat*100}%"></div></div><span>${np?money(s):'No prices'}</span></div>`).join('')}</div></div>
   ${most.length?`<div class="sect"><span>Most worn</span></div>${most.map(i=>row(i,W(i)+'×')).join('')}`:''}
   ${best.length?`<div class="sect"><span>Best value</span><span>cost per wear</span></div>${best.map(i=>row(i,money(cpw(i)))).join('')}`:''}
   ${worst.length?`<div class="sect"><span>Highest cost per wear</span></div>${worst.map(i=>row(i,money(cpw(i)))).join('')}`:''}
   ${never.length?`<div class="sect"><span>Not worn yet</span><span>${never.length}</span></div>${never.slice(0,8).map(i=>row(i,money(i.price))).join('')}`:''}
   ${db.wishlist.length?`<div class="card" style="margin-top:14px"><h2>Wishlist</h2><div class="note" style="margin:0;font-size:13px;color:var(--ink)">${db.wishlist.length} items, ${money(wishTotal)} if you bought everything.</div></div>`:''}
   ${priced.length<it.length?`<p class="note">${it.length-priced.length} piece${it.length-priced.length===1?' has':'s have'} no price yet. Add what you paid to see cost per wear.</p>`:''}`;
}

    <div class="f"><label for="sTheme">Appearance</label><select id="sTheme">${[['auto','Match phone'],['light','Light'],['dark','Dark']].map(([k,n])=>`<option value="${k}" ${k===(db.settings.theme||'auto')?'selected':''}>${n}</option>`).join('')}</select></div></div></div>
   <div class="btns"><button class="btn sec" data-act="export">Export backup</button><label class="btn sec" style="text-align:center">Restore backup<input type="file" accept="application/json,.json" id="restore" hidden></label></div>
   <p class="err" id="sNote" role="alert"></p>`);
  $('sCur').onchange=e=>{db.settings.currency=e.target.value;save();renderAll()};
  $('sTheme').onchange=e=>{db.settings.theme=e.target.value;save();applyTheme()};
  $('restore').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{let v;
    try{v=JSON.parse(r.result);if(!v.items||!Array.isArray(v.items))throw 0}catch(err){$('sNote').textContent="That file isn't a wardrobe backup.";return}
    if(!confirm('Replace everything on this phone with the backup?'))return;
    const photos=v.photos||{};delete v.photos;db={...db,...v};
    for(const [k,data] of Object.entries(photos)){try{const b=await (await fetch(data)).blob();if(idb){await idbReq('readwrite',st=>st.put(b,k));PH[k]=URL.createObjectURL(b)}
      else for(const x of [...db.items,...db.wishlist])if(x.img==='idb:'+k)x.img=data}catch(err){}}
    save();closeSheet();renderAll();toast('Backup restored')};r.readAsText(f)};
}

async function exportBackup(){
  toast('Preparing backup…');
  const photos={};
  if(idb){const all=await idbAll();for(const x of [...db.items,...db.wishlist])if(x.img&&x.img.startsWith('idb:')){const k=x.img.slice(4);if(all[k]&&!photos[k])photos[k]=await blobToData(all[k])}}
  const name='wardrobe-backup-'+todayISO()+'.json',blob=new Blob([JSON.stringify({...db,photos})],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Wardrobe backup'});return}catch(e){if(e&&e.name==='AbortError')return}}
  const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  toast('Backup saved to Downloads');
}

/* ===== actions ===== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,day=a.dataset.day,t=todayISO();
  switch(act){
    case 'close':closeSheet();break;
    case 'addItem':wishToBuy=null;itemForm(null);break;
    case 'editItem':itemForm(id);break;
    case 'saveItem':if(a.disabled)return;a.disabled=true;saveItem(id||null).finally(()=>{a.disabled=false});break;
    case 'delItem':{const it=itemById(id),used=db.outfits.filter(o=>Object.values(o.items).includes(id)).length;
      if(!confirm(`Delete "${it.name}"?${used?` It's in ${used} outfit${used>1?'s':''}, which will lose this piece.`:''}`))return;
      const undo=snapshot();
      db.items=db.items.filter(i=>i.id!==id);db.outfits.forEach(o=>{for(const k in o.items)if(o.items[k]===id)delete o.items[k]});
      // the photo is only thrown away once Undo is no longer offered
      if(it.img)setTimeout(()=>{if(!db.items.some(i=>i.img===it.img)&&!db.wishlist.some(w=>w.img===it.img))dropPhoto(it.img)},7000);
      db.seen=[...new Set([...(db.seen||[]),id])];save();closeSheet();renderAll();toast('Piece deleted',undo);break}
    case 'wearItem':{const it=itemById(id),undo=snapshot(()=>itemSheet(id));it.extraWears=(it.extraWears||0)+1;it.extraLast=t;save();renderAll();itemSheet(id);toast('Logged a wear',undo);break}
    case 'newOutfit':closeSheet();if(db.items.length<2){toast('Add at least two pieces first');return}openBuilder(null);break;
    case 'cancelBuilder':if(B&&B.dirty&&!confirm('Discard this outfit?'))return;if(B)B.dirty=false;
      history.length>1&&history.state&&history.state.v==='builder'?history.back():show('outfits');break;
    case 'editOutfit':closeSheet();openBuilder(id);break;
    case 'delOutfit':{const undo=snapshot();
      db.outfits=db.outfits.filter(o=>o.id!==id);for(const [d,e2] of Object.entries(db.plan))if(e2.outfit===id&&!e2.worn)delete db.plan[d];save();closeSheet();renderAll();toast('Outfit deleted. Days you logged still count.',undo);break}
    case 'wearOutfit':{if(db.plan[t]&&db.plan[t].outfit!==id&&!confirm(`Today already has ${db.plan[t].worn?'a logged':'a planned'} outfit. Replace it with this one?`))return;
      const undo=snapshot(()=>outfitSheet(id));setDay(t,id,true);renderAll();outfitSheet(id);toast('Logged for today',undo);break}
    case 'wearToday':{const undo=snapshot(()=>{});setDay(t,id,true);todayPick=false;renderAll();toast('Logged for today',undo);break}
    case 'wearPlanned':{const undo=snapshot(()=>{});db.plan[t].worn=true;save();todayPick=false;renderAll();toast('Logged for today',undo);break}
    case 'todayChange':todayPick=true;renderToday();break;
    case 'todayKeep':todayPick=false;renderToday();break;
    case 'planOutfit':{const o=db.outfits.find(x=>x.id===id);
      openSheet(`<h2>Plan "${esc(o.name)}"</h2><div class="form"><div class="f"><label for="pDate">Day</label><input id="pDate" type="date" value="${t}"></div><div class="err" id="pErr"></div></div>
       <div class="btns"><button class="btn" data-act="confirmPlan" data-id="${id}">Plan it</button></div>`);break}
    case 'confirmPlan':{const d=$('pDate').value;if(!d){$('pErr').textContent='Pick a day.';return}
      if(db.plan[d]&&db.plan[d].outfit!==id&&!confirm(fmtDate(d)+' already has an outfit. Replace it?'))return;
      setDay(d,id,d<t);renderAll();outfitSheet(id);toast((d<t?'Logged for ':'Planned for ')+fmtDate(d));break}
    case 'today':daySheet(t);break;
    case 'setDay':setDay(day,id);renderAll();daySheet(day);toast(day<t?'Logged':'Planned');break;
    case 'markWorn':db.plan[day].worn=true;save();renderAll();daySheet(day);toast('Marked as worn');break;
    case 'unmarkWorn':db.plan[day].worn=false;save();renderAll();daySheet(day);break;
    case 'changeDay':daySheet(day,true);break;
    case 'clearDay':{const was=db.plan[day],undo=snapshot();delete db.plan[day];save();closeSheet();renderAll();toast(was&&was.worn?'Removed. Wears for that day are taken off.':'Removed from '+fmtDate(day),undo);break}
    case 'addWish':wishForm(null);break;
    case 'editWish':wishForm(id);break;
    case 'saveWish':if(a.disabled)return;a.disabled=true;saveWish(id||null).finally(()=>{a.disabled=false});break;
    case 'delWish':{const undo=snapshot();db.wishlist=db.wishlist.filter(w=>w.id!==id);db.seen=[...new Set([...(db.seen||[]),id])];save();closeSheet();renderAll();toast('Removed from wishlist',undo);break}
    case 'boughtWish':{const w=db.wishlist.find(x=>x.id===id);wishToBuy=id;
      itemForm(null,{name:w.name,brand:w.brand,cat:w.cat,size:w.size,price:w.price,url:w.url,img:w.img,notes:w.notes,bought:t.slice(0,7)});break}
    case 'settings':settingsSheet();break;
    case 'doUpdate':applyUpdate();break;
    case 'checkUpd':checkUpdate(true).then(()=>{if($('sheetBg').classList.contains('on'))settingsSheet()});break;
    case 'install':doInstall();break;
    case 'laterInstall':try{localStorage.setItem('wardrobe-welcomed','1')}catch(err){}closeSheet();break;
    case 'hideInstall':try{localStorage.setItem('wardrobe-install-hidden','1')}catch(err){}refreshInstall();toast('Install any time from Settings');break;
    case 'export':exportBackup();break;
  }
});

/* ===== updates =====
   version.json on the server says which version is out. If it's newer than this copy, the app
   shows a banner, a red dot on Settings and Insights, and the change notes. Update activates the
   new offline copy and reloads. Your closet data stays on the phone and isn't touched. */
let remoteVer=null,reloading=false;
const newer=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
async function checkUpdate(manual){
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;remoteVer=await r.json()}catch(e){if(manual)toast("Couldn't reach the server");return}
  const up=newer(remoteVer.version,APP_VERSION);
  $('updBanner').classList.toggle('on',up);$('gearDot').classList.toggle('on',up);$('navDot').classList.toggle('on',up);
  if(up){const n=(remoteVer.notes||[]).find(n=>n.version===remoteVer.version);$('updText').textContent=n?n.text:'Version '+remoteVer.version+' is ready.'}
  else if(manual)toast('You have the latest version');
  if(up&&'serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)reg.update().catch(()=>{})}
}
async function applyUpdate(){
  toast('Updating…');
  const reg='serviceWorker' in navigator&&await navigator.serviceWorker.getRegistration();
  // a version that's already downloaded switches over at once; otherwise download it first
  // (with time limits, so a slow network can't leave the button doing nothing)
  const go=w=>{w.postMessage('skipWaiting');setTimeout(()=>{if(!reloading)location.reload()},2500)};
  if(reg&&reg.waiting)return go(reg.waiting);
  if(reg){
    const w=await new Promise(res=>{const t=setTimeout(()=>res(reg.waiting||reg.installing),12000);
      const watch=n=>n&&n.addEventListener('statechange',()=>{if(n.state==='installed'){clearTimeout(t);res(n)}});
      watch(reg.installing);reg.addEventListener('updatefound',()=>watch(reg.installing));
      Promise.race([reg.update(),new Promise(r=>setTimeout(r,8000))]).catch(()=>{}).then(()=>{if(reg.waiting){clearTimeout(t);res(reg.waiting)}})});
    if(w)return go(w);
  }
  location.reload();
}
// reload only when a new version takes over, not when offline mode switches on for the first time
const hadController='serviceWorker' in navigator&&!!navigator.serviceWorker.controller;
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloading){reloading=true;location.reload()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

/* ===== boot =====
   Pieces and wishes added with the import tool arrive via data/*.json. Pieces already on the
   phone keep your own edits (price, notes, wears); only the photo and size chart refresh. */
async function boot(){
  load();applyTheme();
  history.replaceState({v:'closet'},'');
  idb=await idbOpen();
  if(idb){try{const all=await idbAll();for(const [k,b] of Object.entries(all))PH[k]=URL.createObjectURL(b);
    // older versions kept your photos inline; move them to the photo store
    for(const x of [...db.items,...db.wishlist])if(x.img&&x.img.startsWith('data:')){const b=await (await fetch(x.img)).blob();x.img=await storePhoto(b)}}catch(e){}}
  // ask the browser not to clear the closet when the phone runs low on space
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const get=async p=>{try{const r=await fetch(p,{cache:'no-cache'});return r.ok?await r.json():null}catch(e){return null}};
  const [items,wish]=await Promise.all([get('data/items.json'),get('data/wishlist.json')]);
  const seen=new Set(db.seen||[]);
  if(items)for(const s of items.items.filter(i=>i.owned)){
    const cur=itemById(s.id);
    if(cur){if(!cur.imgEdited)cur.img=s.img;if(!cur.sizesEdited)cur.sizes=s.sizes;if(!cur.url)cur.url=s.url}
    else if(!seen.has(s.id)){db.items.push({id:s.id,name:s.name,brand:s.brand,cat:s.cat,img:s.img,url:s.url,size:s.size,sizes:s.sizes,
      color:s.color||'',price:s.price??null,bought:s.bought||'',store:s.store||'',notes:s.notes||'',added:s.added||new Date().toISOString()});seen.add(s.id)}
  }
  if(wish)for(const s of wish.items||[])if(!db.wishlist.some(w=>w.id===s.id)&&!seen.has(s.id)){db.wishlist.push({added:new Date().toISOString(),priority:'nice',...s});seen.add(s.id)}
  db.seen=[...seen];save();renderAll();refreshInstall();welcome();checkUpdate();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
